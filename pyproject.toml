[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ttft-itl-benchmark"
version = "0.1.0"
description = "Concurrency-sweep benchmark for streamed OpenAI-compatible inference endpoints."
requires-python = ">=3.10"
dependencies = ["httpx>=0.27", "typer>=0.12"]

[project.optional-dependencies]
test = ["pytest>=8.0"]
plot = ["matplotlib>=3.8"]

[project.scripts]
ttft-itl-benchmark = "ttft_itl_benchmark.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/ttft_itl_benchmark"]

[tool.pytest.ini_options]
testpaths = ["tests"]
